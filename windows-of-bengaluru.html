<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Windows of Bengaluru</title>
  <link rel="preload" href="assets/fonts/baloo-tamma-2-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
/* Fonts are bundled in assets/fonts (Baloo Tamma 2 has Kannada; Rozha One for painted signs). Works offline. */

  src: url('assets/fonts/baloo-tamma-2-kannada-400-normal.woff2') format('woff2'); unicode-range: U+0C80-0CFF, U+200C-200D, U+20B9, U+25CC; }

@font-face { font-family: 'Baloo Tamma 2'; font-style: normal; font-weight: 600; font-display: swap;
  src: url('assets/fonts/baloo-tamma-2-kannada-600-normal.woff2') format('woff2'); unicode-range: U+0C80-0CFF, U+200C-200D, U+20B9, U+25CC; }

  src: url('assets/fonts/baloo-tamma-2-latin-600-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+270C; }
@font-face { font-family: 'Baloo Tamma 2'; font-style: normal; font-weight: 800; font-display: swap;
  src: url('assets/fonts/baloo-tamma-2-kannada-800-normal.woff2') format('woff2'); unicode-range: U+0C80-0CFF, U+200C-200D, U+20B9, U+25CC; }
@font-face { font-family: 'Baloo Tamma 2'; font-style: normal; font-weight: 800; font-display: swap;
  src: url('assets/fonts/baloo-tamma-2-latin-800-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+270C; }
@font-face { font-family: 'Rozha One'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('assets/fonts/rozha-one-latin-400-normal.woff2') format('woff2'); }

:root {
  --wall: #2f5552;
  --cream: #f3e6c8;
  --ink: #2a1a12;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #1b2a2a;
  font-family: 'Baloo Tamma 2', sans-serif;
  color: var(--cream);
  -webkit-font-smoothing: antialiased;
}
#stage {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; overflow: visible; cursor: none;
  opacity: 0; transition: opacity 1.2s ease;
  touch-action: none; user-select: none;
}
body.ready #stage { opacity: 1; }

/* paper grain + vignette: one static layer, no runtime cost */
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .1  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode: multiply; opacity: .35;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at 50% 48%, transparent 45%, rgba(10, 22, 21, .55) 100%);
}

/* words */
.say {
  opacity: 0; transition: opacity .8s ease;
  paint-order: stroke; stroke: #1c3836; stroke-width: 6px; stroke-linejoin: round;
}
.say.on { opacity: var(--o, 1); }

#status {
  position: fixed; left: 18px; bottom: 14px; z-index: 2;
  font-size: 14px; opacity: .55; letter-spacing: .3px; pointer-events: none;
}

#sound {
  position: fixed; right: 16px; bottom: 12px; z-index: 3;
  font: 14px 'Baloo Tamma 2', sans-serif; color: var(--cream); letter-spacing: .3px;
  background: none; border: 0; padding: 4px 6px; opacity: .6; cursor: pointer;
}
#sound:hover, #sound:focus-visible { opacity: 1; outline: none; text-decoration: underline wavy; }
#sound.on { opacity: .45; }

#gestures {
  position: fixed; left: 14px; top: 12px; z-index: 3;
  font: 600 15px 'Baloo Tamma 2', sans-serif; color: var(--ink);
  background: #f6ecd2; border: 2px solid var(--ink); border-radius: 6px; padding: 3px 10px 1px;
  box-shadow: 3px 3px 0 rgba(0,0,0,.35); cursor: pointer; opacity: .9;
}
#gestures:hover, #gestures:focus-visible { opacity: 1; outline: none; transform: translate(-1px, -1px); box-shadow: 4px 4px 0 rgba(0,0,0,.35); }

/* the little enamel sign */
.look-again { opacity: 0; pointer-events: none; transition: opacity .9s ease; cursor: pointer; outline: none; }
.look-again.on { opacity: 1; pointer-events: auto; }
.look-again:focus-visible .swing { filter: drop-shadow(0 0 6px #ffe9a0); }
.swing { transform-box: view-box; transform-origin: 800px 872px; animation: swing 3.4s ease-in-out infinite; }
.look-again:hover .swing { animation-duration: 1.2s; }

/* ambient life */
.bob { animation: bob 3.2s ease-in-out infinite; }
.bob.slow { animation-duration: 6s; }
.sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 6s ease-in-out infinite; }
.sway.slow { animation-duration: 9s; }
.drift { animation: drift 70s ease-in-out infinite alternate; }
.drift.slow { animation-duration: 110s; animation-direction: alternate-reverse; }
.steam { animation: steam 2.8s ease-in-out infinite; }
.walk { animation: walk 30s ease-in-out infinite alternate; }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
.beam { animation: beam 5s ease-in-out infinite; }
.beam.slow { animation-duration: 8s; }
@keyframes beam { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
/* MTR fans */
.spin { transform-box: fill-box; transform-origin: center; animation: spin 1.6s linear infinite; }
.spin.fast { animation-duration: .25s; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Vidyarthi Bhavan plate tower */
.wobble { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 2.4s ease-in-out infinite; }
.wobble.hard { animation-duration: .5s; }
@keyframes wobble { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
/* Brahmin's rain */
.rain { animation: rain 1.3s linear infinite; }
.rain.slow { animation-duration: 2.2s; }
.rain.fast { animation-duration: .8s; }
.rain.pour { animation-duration: .4s; }
@keyframes rain { from { transform: translateY(0); } to { transform: translateY(1300px); } }
.drip { animation: drip 1.8s ease-in infinite; }
@keyframes drip { 0%, 40% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(220px); opacity: 0; } }
.ripple { transform-box: fill-box; transform-origin: center; animation: ripple 2s ease-out infinite; }
@keyframes ripple { from { transform: scale(.3); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
/* Taaza Thindi tubelights + moths */
.tube.flick { animation: flick .16s steps(2) 10; }
@keyframes flick { 0% { opacity: 1; } 50% { opacity: .15; } 100% { opacity: 1; } }
.orbit { transform-origin: 0 0; animation: orbit 3s linear infinite; }
.orbit.frenzy { animation-duration: .45s; }
@keyframes orbit { to { transform: rotate(360deg); } }
.chit-swing { transform-box: view-box; transform-origin: 800px 120px; animation: chitswing 4s ease-in-out infinite; }
@keyframes chitswing { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
.strap { transform-box: fill-box; transform-origin: 50% 0%; animation: strap 3.6s ease-in-out infinite; }
@keyframes strap { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.bell-body.ring { transform-box: fill-box; transform-origin: 50% 0%; animation: ring .16s ease-in-out 5 alternate; }
@keyframes ring { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
.bus-bell:focus-visible .bell-glow { opacity: .5; }
.crowd { animation: crowd 60s linear infinite; }
@keyframes crowd { from { transform: translateX(0); } to { transform: translateX(-1800px); } }
.gone { opacity: 0; transition: opacity .2s; }
.flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .9s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { transform: scale(1, 1); } 40% { transform: scale(.9, 1.12); } 70% { transform: scale(1.06, .94); } }

@keyframes bob { 50% { transform: translateY(-2.5px); } }
@keyframes sway { 0%, 100% { transform: rotate(-.6deg); } 50% { transform: rotate(.6deg); } }
@keyframes drift { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
@keyframes steam { 0%, 100% { opacity: .15; transform: translateY(2px); } 50% { opacity: .85; transform: translateY(-5px); } }
@keyframes walk { from { transform: translateX(-280px); } to { transform: translateX(300px); } }
@keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(20deg); } }
@keyframes swing { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }

@media (prefers-reduced-motion: reduce) {
  .bob, .sway, .drift, .steam, .walk, .twinkle, .swing, .flicker, .beam, .spin, .wobble, .drip, .ripple, .orbit, .chit-swing, .strap, .crowd { animation: none; }
  .rain { animation-duration: 6s; }
}

/* tuning panel (press D) */
#debug {
  position: fixed; right: 14px; top: 14px; z-index: 5; display: none;
  background: rgba(12, 18, 18, .88); border-radius: 8px; padding: 8px;
  font: 11px/1.45 ui-monospace, Menlo, monospace; color: #cfe8df;
}
#debug.on { display: block; }
#debug canvas { display: block; border-radius: 4px; }
#debug pre { margin: 6px 0 0; white-space: pre; }

</style>
